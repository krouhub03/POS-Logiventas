name: 'Release y Auto-Update'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: 'Compilar y Publicar Release'
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache de dependencias Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Instalar dependencias del frontend
        run: npm ci

      - name: Extraer notas de versión desde CHANGELOG.md
        id: changelog_reader
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $body = ""
          if (Test-Path "CHANGELOG.md") {
            $lines = Get-Content "CHANGELOG.md"
            $recording = $false
            $notes = @()
            foreach ($line in $lines) {
              if ($line -match "^## \[$version\]") {
                $recording = $true
                continue
              }
              if ($recording -and $line -match "^## \[") {
                break
              }
              if ($recording) {
                $notes += $line
              }
            }
            $body = ($notes -join "`n").Trim() -replace '(?m)^---\s*$', ''
            $body = $body.Trim()
          }
          if (-not $body) {
            $body = "Actualización automática de Metahabi POS v__VERSION__. Descarga el instalador o deja que tu terminal POS se actualice silenciosamente en segundo plano."
          }
          $delimiter = [guid]::NewGuid().ToString()
          "notes<<$delimiter`n$body`n$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Compilar y Publicar en GitHub Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Metahabi POS v__VERSION__'
          releaseBody: ${{ steps.changelog_reader.outputs.notes }}
          releaseDraft: false
          prerelease: false
