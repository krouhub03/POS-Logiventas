name: 'Release y Auto-Update'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: 'Compilar y Publicar Release'
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache de dependencias Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Instalar dependencias del frontend
        run: npm ci

      - name: Compilar y Publicar en GitHub Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Metahabi POS v__VERSION__'
          releaseBody: 'Actualización automática de Metahabi POS v__VERSION__. Descarga el instalador o deja que tu terminal POS se actualice silenciosamente en segundo plano.'
          releaseDraft: false
          prerelease: false
