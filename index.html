<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/metahabi-icon.png" />
    <title>Metahabi POS</title>
    <style>
      /* Evita el parpadeo blanco nativo del navegador antes de cargar React */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #020617;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }
      #splash-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
        z-index: 9999;
      }
      .splash-logo {
        width: 84px;
        height: 84px;
        object-fit: contain;
        animation: splash-pulse 2s infinite ease-in-out;
      }
      .splash-title {
        margin-top: 20px;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #ffffff;
      }
      .splash-subtitle {
        margin-top: 4px;
        font-size: 11px;
        color: #34d399;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .splash-bar {
        margin-top: 24px;
        width: 130px;
        height: 3px;
        background: #1e293b;
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }
      .splash-progress {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        background: linear-gradient(90deg, #10b981, #38bdf8);
        border-radius: 9999px;
        animation: splash-indeterminate 1.4s infinite ease-in-out;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.3)); }
        50% { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(56, 189, 248, 0.6)); }
      }
      @keyframes splash-indeterminate {
        0% { left: -40%; width: 30%; }
        50% { left: 25%; width: 60%; }
        100% { left: 100%; width: 40%; }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="splash-loader">
        <img class="splash-logo" src="/metahabi-icon.png" alt="Metahabi POS" />
        <div class="splash-title">Metahabi POS</div>
        <div class="splash-subtitle">Iniciando Estación de Caja...</div>
        <div class="splash-bar">
          <div class="splash-progress"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
